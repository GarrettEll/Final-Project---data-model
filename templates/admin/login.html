{% extends "admin/base_site.html" %}

{% block title %}CampusConnect Admin Login{% endblock %}

{% block content %}
<div class="text-center">
    <h1 class="h3 mb-3 font-weight-normal">Welcome to CampusConnect Admin</h1>
    <p>Please log in to manage CampusConnect.</p>
</div>

<form method="post" action="{% url 'admin:login' %}" class="form-signin">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block mt-2">Log in</button>
</form>

<p class="mt-3">
    <a href="{% url 'password_reset' %}">Forgot your password?</a>
</p>
{% endblock %}
