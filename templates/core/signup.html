<!-- signup.html -->
{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
  <div class="card-header">Sign Up</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          {{ field.label_tag }}
          {{ field }}
          {% if field.errors %}
            <div class="text-danger">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button class="btn btn-success">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
