<!-- post_form.html -->
{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header">
    {% if form.instance.pk %}Edit{% else %}New{% endif %} Post
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          {{ field.label_tag }}
          {{ field }}
          {% if field.errors %}
            <div class="text-danger">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-success">Save</button>
    </form>
  </div>
</div>
{% endblock %}
