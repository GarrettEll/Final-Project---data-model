<!-- post_confirm_delete.html -->
{% extends 'base.html' %}
{% block content %}
<div class="card border-danger">
  <div class="card-body">
    <h3 class="text-danger">Delete Post</h3>
    <p>Are you sure you want to delete <strong>{{ object.title }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'post-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
